<!doctype html><meta charset="utf-8"><body>
<script src="../web/js/vendor/cv.js"></script><script src="../web/js/vendor/aruco.js"></script>
<script type="module">
import { makeLayout, renderSheetSVG, MARGIN } from '../web/js/templateSpec.js';
import { frameGeometry } from '../web/js/tracking.js';
const L = makeLayout('a4', 1);
const svg = renderSheetSVG(L, 0);
const img = new Image();
img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
await img.decode();
const out = [];
for (const rot of [0, 0.3, 1.2, 2.5, -2.0]) {
  const c = document.createElement('canvas'); c.width = 1200; c.height = 1400;
  const g = c.getContext('2d'); g.fillStyle = '#777'; g.fillRect(0,0,c.width,c.height);
  const pxmm = 4; // px per mm
  g.translate(600, 700); g.rotate(rot); g.scale(pxmm, pxmm); g.translate(-105, -148.5);
  g.drawImage(img, 0, 0, 210, 297);
  const id = g.getImageData(0,0,c.width,c.height);
  const det = new AR.Detector({ dictionaryName: 'ARUCO_MIP_36h12', maxHammingDistance: 4 });
  const ms = det.detect(id).map(m => ({id:m.id, corners:m.corners.map(p=>[p.x,p.y])}));
  const geo = frameGeometry(ms, L, { width: c.width, height: c.height });
  out.push({ rot, n: ms.length, ids: ms.map(m=>m.id).sort((a,b)=>a-b).join(','), rms: geo && geo.rms, tilt: geo && geo.tiltDeg });
}
window.RESULT = out;
</script>
