name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write runtime config
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          node -e 'const u=process.env.WORKER_URL||""; require("fs").writeFileSync("web/js/config.js", `export const CONFIG = ${JSON.stringify({ workerUrl: u, appName: "Foot Fit" }, null, 2)};\n`)'
          cat web/js/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
